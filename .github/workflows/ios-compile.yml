# Standalone unsigned XCTest helper for the owner's device testing.
name: iOS compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phonerunner:
    runs-on: macos-26-intel
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: 17d39b000a5d0681e3f7b61a105a36f6f31dd41ab9073f625fd466f38035f901
      PHONE_RUNNER_TEST_BUNDLE: io.github.ccch1mneyyy.dshgo.PhoneRunner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare the Xcode project's generated Swift package
        shell: bash
        run: |
          archive="flutter_macos_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          python3 app/tool/l10n_merge.py --no-gen
          cd app
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          flutter build ios --debug --no-codesign --config-only

      - name: Build the PhoneRunner device test bundle
        shell: bash
        run: |
          xcodebuild build-for-testing -project app/ios/Runner.xcodeproj -scheme PhoneRunner \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PhoneRunnerBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS=PhoneRunner/PhoneRunnerSelf.entitlements \
            "PRODUCT_BUNDLE_IDENTIFIER=$PHONE_RUNNER_TEST_BUNDLE"

      - name: Validate and package the nested XCTest helper
        shell: bash
        run: |
          runner="$RUNNER_TEMP/PhoneRunnerBuild/Build/Products/Debug-iphoneos/PhoneRunnerUITests-Runner.app"
          test_bundle="$runner/PlugIns/PhoneRunnerUITests.xctest"
          runner_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$runner/Info.plist")"
          test_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$test_bundle/Info.plist")"
          test "$runner_id" = "$PHONE_RUNNER_TEST_BUNDLE.xctrunner"
          test "$test_id" = "$PHONE_RUNNER_TEST_BUNDLE"
          for bundle in "$runner" "$test_bundle"; do
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Info.plist")"
            xcrun lipo "$bundle/$executable" -verify_arch arm64
          done
          test ! -f "$runner/embedded.mobileprovision"
          package="$RUNNER_TEMP/phonerunner-package"
          mkdir -p "$package/Payload"
          /usr/bin/ditto "$runner" "$package/Payload/PhoneRunnerUITests-Runner.app"
          (cd "$package" && /usr/bin/ditto -c -k --keepParent Payload "$package/DSH-Go-PhoneRunner-v1.2.0-unsigned.ipa")
          unzip -tq "$package/DSH-Go-PhoneRunner-v1.2.0-unsigned.ipa"
          shasum -a 256 "$package/DSH-Go-PhoneRunner-v1.2.0-unsigned.ipa"
          printf 'Runner bundle: %s\nXCTest bundle: %s\n' "$runner_id" "$test_id"

      - name: Upload the verified PhoneRunner IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phonerunner-unsigned-ipa
          path: ${{ runner.temp }}/phonerunner-package/DSH-Go-PhoneRunner-v1.2.0-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
